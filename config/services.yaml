parameters:
    withdrawing_app_secret: 'withdrawing-standalone-test-secret'
    withdrawing_database_url: 'sqlite:///%kernel.cache_dir%/withdrawing.db'

services:
    _defaults:
        autowire: true
        autoconfigure: true
    _instanceof:
        App\Withdrawing\ServiceInterface\WithdrawalSourceServiceInterface:
            tags: ['app.withdrawing.source']
        App\Withdrawing\ServiceInterface\WithdrawalRailServiceInterface:
            tags: ['app.withdrawing.rail']

    App\Withdrawing\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/WithdrawingBundle.php'

    App\Withdrawing\RepositoryInterface\WithdrawalRepositoryInterface:
        alias: App\Withdrawing\Repository\WithdrawalRepository
